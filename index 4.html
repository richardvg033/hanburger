<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CHEESEBURGER 🍔</title><style>*{box-sizing:border-box}body{margin:0;background:#172033;color:white;font-family:system-ui,Arial;text-align:center;overflow-x:hidden}h1{font-size:clamp(24px,6vw,44px);margin:12px 0 4px;color:#ffd65c;text-shadow:3px 3px #a54a23}p{margin:4px 0 12px}canvas{display:block;width:min(96vw,960px);height:auto;margin:auto;border:4px solid #fff2b3;border-radius:14px;background:#91d9ff;touch-action:none}.controls{display:flex;justify-content:space-between;max-width:960px;margin:12px auto;padding:0 14px;gap:15px}.group{display:flex;gap:12px}button{border:0;border-radius:18px;background:#ffcc49;color:#40270e;font-size:25px;font-weight:900;min-width:75px;min-height:68px;box-shadow:0 5px #ad712b;touch-action:none;user-select:none}button:active{transform:translateY(3px);box-shadow:0 2px #ad712b}#restart{font-size:15px;min-height:40px;margin:8px}small{color:#d3d8ea}</style></head><body><h1>🍔 CHEESEBURGER 🍔</h1><p id="status">Verzamel burgers, ontwijk vijanden en bereik de vlag!</p><canvas id="game" width="960" height="500"></canvas><div class="controls"><div class="group"><button id="left">◀</button><button id="right">▶</button></div><button id="jump">⬆ SPRING</button></div><button id="restart">🔄 Opnieuw beginnen</button><div><small>Windows: ← → en spatie / ↑ · iPhone: knoppen onder het spel</small></div><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const W=960,H=500,GRAV=.65,keys={left:false,right:false,jump:false};let level=0,lives=3,score=0,won=false,gameOver=false,cam=0,player,world,platforms,burgers,enemies,goal,checkpoint=0;
const designs=[{width:2150,plats:[[0,440,520,60],[610,440,440,60],[1140,440,390,60],[1620,440,530,60],[260,350,150,20],[690,335,180,20],[1210,340,150,20],[1730,330,180,20]],coins:[[320,315],[735,300],[860,395],[1230,305],[1410,395],[1800,295]],foes:[[780,408],[1320,408],[1840,408]]},{width:2600,plats:[[0,440,450,60],[560,440,370,60],[1030,440,330,60],[1490,440,400,60],[2000,440,600,60],[220,340,160,20],[620,320,130,20],[1090,310,170,20],[1530,330,160,20],[2060,310,170,20]],coins:[[270,305],[665,285],[820,395],[1160,275],[1575,295],[1780,395],[2120,275],[2360,395]],foes:[[670,408],[1170,408],[1620,408],[2180,408]]},{width:3000,plats:[[0,440,380,60],[490,440,340,60],[940,440,300,60],[1360,440,340,60],[1810,440,370,60],[2310,440,690,60],[160,330,130,20],[550,310,150,20],[1010,310,130,20],[1450,320,130,20],[1870,300,150,20],[2440,310,170,20]],coins:[[220,295],[620,275],[760,395],[1060,275],[1500,285],[1920,265],[2090,395],[2500,275],[2750,395]],foes:[[580,408],[1060,408],[1510,408],[1950,408],[2470,408],[2740,408]]}];
function startLevel(){const d=designs[level];world=d.width;platforms=d.plats.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));burgers=d.coins.map(a=>({x:a[0],y:a[1],taken:false}));enemies=d.foes.map(a=>({x:a[0],y:a[1],start:a[0],dir:1,alive:true}));goal={x:world-100,y:325};player={x:45,y:320,w:46,h:54,vx:0,vy:0,ground:false,inv:0};cam=0;won=false;gameOver=false;updateStatus()}
function updateStatus(){status.textContent=won?'🏆 GEWONNEN! Jij bent de CHEESEBURGER-kampioen!':gameOver?'💔 Game over! Klik op opnieuw beginnen.':`LEVEL ${level+1}/3   ❤️ ${lives} levens   🍔 ${score} burgers — Bereik de vlag!`}
function reset(){level=0;lives=3;score=0;startLevel()}document.querySelector('#restart').onclick=reset;
function bind(id,k){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture(e.pointerId)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(evt,()=>keys[k]=false)}bind('left','left');bind('right','right');bind('jump','jump');
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(['Space','ArrowUp','KeyW'].includes(e.code))keys.jump=true});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(['Space','ArrowUp','KeyW'].includes(e.code))keys.jump=false});window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function hurt(){if(player.inv>0)return;lives--;updateStatus();if(lives<=0){gameOver=true;return}player.x=Math.max(35,player.x-110);player.y=260;player.vy=-7;player.inv=100}
function tick(){if(!won&&!gameOver){let oldY=player.y;player.vx=(Number(keys.right)-Number(keys.left))*4.5;player.x=Math.max(0,Math.min(world-player.w,player.x+player.vx));if(keys.jump&&player.ground){player.vy=-13.6;player.ground=false}player.vy=Math.min(16,player.vy+GRAV);player.y+=player.vy;player.ground=false;for(const p of platforms){if(collide(player,p)&&oldY+player.h<=p.y+13&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true}}if(player.y>H+120)hurtFall();if(player.inv>0)player.inv--;for(const b of burgers){if(!b.taken&&Math.hypot(player.x+23-b.x,player.y+25-b.y)<39){b.taken=true;score++;updateStatus()}}for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*(1.05+level*.35);if(Math.abs(e.x-e.start)>65)e.dir*=-1;const r={x:e.x,y:e.y,w:37,h:32};if(collide(player,r)){if(player.vy>1&&oldY+player.h<=e.y+16){e.alive=false;player.vy=-10;score+=2;updateStatus()}else hurt()}}if(player.x+player.w>goal.x&&player.y+player.h>goal.y){if(level<2){level++;startLevel()}else{won=true;updateStatus()}}cam=Math.max(0,Math.min(world-W,player.x-W*.36))}draw();requestAnimationFrame(tick)}function hurtFall(){lives--;if(lives<=0){gameOver=true}else{player.x=45;player.y=260;player.vy=0;player.inv=90}updateStatus()}
function burger(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#f4ac42';ctx.beginPath();ctx.ellipse(0,-5,20,11,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#613720';ctx.fillRect(-20,-5,40,7);ctx.fillStyle='#f6df45';ctx.fillRect(-20,1,40,5);ctx.fillStyle='#4baa52';ctx.fillRect(-20,6,40,4);ctx.fillStyle='#e6a04b';ctx.beginPath();ctx.ellipse(0,12,21,7,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#8cdaff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff2a0';ctx.beginPath();ctx.arc(810,75,42,0,7);ctx.fill();for(let i=0;i<12;i++){let x=((i*247-cam*.2)%(W+280)+W+280)%(W+280)-80,y=70+i%3*52;ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.ellipse(x,y,56,18,0,0,7);ctx.fill()}ctx.fillStyle='#72c990';for(let i=0;i<15;i++){let x=i*230-cam*.45;ctx.beginPath();ctx.arc(x,465,140,Math.PI,0);ctx.fill()}ctx.save();ctx.translate(-cam,0);for(const p of platforms){ctx.fillStyle='#935b37';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#48b951';ctx.fillRect(p.x,p.y,p.w,13);ctx.fillStyle='#6d412b';for(let i=15;i<p.w;i+=50)ctx.fillRect(p.x+i,p.y+30,22,8)}for(const b of burgers)if(!b.taken)burger(b.x,b.y,.78);for(const e of enemies)if(e.alive){ctx.fillStyle='#ab564b';ctx.beginPath();ctx.ellipse(e.x+18,e.y+18,20,16,0,0,7);ctx.fill();ctx.fillStyle='white';ctx.fillRect(e.x+8,e.y+9,7,8);ctx.fillRect(e.x+22,e.y+9,7,8);ctx.fillStyle='#241b1a';ctx.fillRect(e.x+11,e.y+12,3,4);ctx.fillRect(e.x+25,e.y+12,3,4)}ctx.fillStyle='#eee';ctx.fillRect(goal.x,goal.y,6,115);ctx.fillStyle='#ff544c';ctx.beginPath();ctx.moveTo(goal.x+6,goal.y);ctx.lineTo(goal.x+75,goal.y+20);ctx.lineTo(goal.x+6,goal.y+40);ctx.fill();if(player.inv%10<5){let x=player.x,y=player.y;ctx.fillStyle='#394e9e';ctx.fillRect(x+7,y+34,14,19);ctx.fillRect(x+26,y+34,14,19);ctx.fillStyle='#f6c18e';ctx.beginPath();ctx.ellipse(x+23,y+23,23,24,0,0,7);ctx.fill();ctx.fillStyle='#e74836';ctx.fillRect(x+4,y+2,38,10);ctx.fillRect(x+11,y-5,27,10);ctx.fillStyle='#222';ctx.fillRect(x+14,y+18,4,6);ctx.fillRect(x+30,y+18,4,6);ctx.fillStyle='#874b2c';ctx.fillRect(x+19,y+29,12,4);ctx.fillStyle='#e43b36';ctx.fillRect(x+4,y+34,39,11);ctx.fillStyle='#ffdb57';ctx.fillRect(x+19,y+36,10,6)}ctx.restore();ctx.fillStyle='rgba(16,33,55,.75)';ctx.fillRect(14,12,265,47);ctx.fillStyle='white';ctx.font='bold 21px system-ui';ctx.fillText(`LEVEL ${level+1}   ❤️ ${lives}   🍔 ${score}`,26,43);if(gameOver||won){ctx.fillStyle='rgba(12,20,34,.76)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffdc6a';ctx.textAlign='center';ctx.font='bold 56px system-ui';ctx.fillText(won?'🏆 GEWONNEN!':'💔 GAME OVER',W/2,220);ctx.fillStyle='white';ctx.font='24px system-ui';ctx.fillText('Klik op Opnieuw beginnen',W/2,270);ctx.textAlign='left'}}startLevel();requestAnimationFrame(tick);
</script></body></html>
